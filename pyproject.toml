[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-clustering"
version = "0.1.0"
description = "Local Portuguese contract discovery with reproducible, deduplicated clustering"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "scikit-learn>=1.5", "pymupdf>=1.24", "pandas>=2.2", "matplotlib>=3.9", "plotly>=5", "pyyaml>=6"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "torch>=2.4", "umap-learn>=0.5"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
contract-clustering = "contract_clustering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "semantic" }
